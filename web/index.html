<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignora un apple-touch-icon en SVG: necesita el PNG de 180x180 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- viewport-fit=cover + los safe-area-inset del CSS: la barra inferior no queda debajo
         del indicador de gestos del iPhone -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NeuroLift" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Tus entrenamientos, tus marcas y tu progreso." />
    <title>NeuroLift</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
